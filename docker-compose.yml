services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: firesight
      POSTGRES_PASSWORD: firesight
      POSTGRES_DB: firesight
    ports:
      - "5432:5432"
    volumes:
      - firesight_pg:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firesight -d firesight"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg2://firesight:firesight@db:5432/firesight
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

volumes:
  firesight_pg:
